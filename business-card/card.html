<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sri Guru HR Consultants – Visiting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Standard Indian visiting card: 3.5in x 2in. Print: one side per page. */
    @page { size: 3.5in 2in; margin: 0; }

    :root {
      --navy: #12245c;
      --navy-2: #1d3a8f;
      --ocean: #0b5d8f;
      --sky: #3d9be0;
      --crimson: #b3172e;
      --rose: #ef4b63;
      --gold: #f5b83d;
      --orange: #f39a55;
      --orange-dark: #c8621c;
      --teal: #5ec2bb;
      --ink: #1f2a44;
      --muted: #5a6680;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      background: #dfe4ee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card {
      position: relative;
      width: 3.5in;
      height: 2in;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(18, 36, 92, 0.25);
    }

    @media print {
      body { background: none; padding: 0; gap: 0; display: block; }
      .card { border-radius: 0; box-shadow: none; page-break-after: always; break-after: page; }
    }

    /* ---------- Front ---------- */
    .front {
      background:
        radial-gradient(circle at 88% 12%, rgba(79, 163, 224, 0.35), transparent 45%),
        linear-gradient(140deg, #173f73 0%, #2468a8 60%, #2a8f88 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .front .ghost {
      position: absolute;
      right: -0.55in;
      bottom: -0.45in;
      width: 1.6in;
      height: 1.27in;
      opacity: 0.1;
      filter: brightness(0) invert(1);
    }
    .front .brand { position: relative; display: flex; align-items: center; gap: 0.12in; }
    .front .brand svg { width: 0.95in; height: 0.75in; }
    .front .name {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .front .sub {
      margin-top: 6px;
      font-size: 7.6px;
      font-weight: 800;
      letter-spacing: 0.32em;
      color: #ff6b7d;
    }
    .front .tagline {
      position: absolute;
      bottom: 0.17in;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 8.5px;
      color: #c9d6f2;
      letter-spacing: 0.02em;
    }
    .front .tagline::before, .front .tagline::after {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      background: var(--orange);
      vertical-align: middle;
      margin: 0 8px;
      opacity: 0.8;
    }

    /* ---------- Back ---------- */
    .back {
      background: #fff;
      color: var(--ink);
      padding: 0.2in 0.22in;
    }
    .back .arcs {
      position: absolute;
      right: -0.4in;
      bottom: -0.32in;
      width: 1.45in;
      height: 1.15in;
      opacity: 0.13;
    }
    .back .head { display: flex; align-items: center; gap: 7px; }
    .back .head svg { width: 36px; height: 28px; }
    .back .head .n { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 12.5px; color: var(--navy); line-height: 1; }
    .back .head .s { font-size: 5.2px; font-weight: 800; letter-spacing: 0.3em; color: #c8102e; margin-top: 3px; }

    .back .person {
      margin-top: 0.13in;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--navy);
    }
    .back .rule {
      width: 34px;
      height: 2px;
      margin: 5px 0 9px;
      background: linear-gradient(90deg, var(--sky), var(--teal), var(--orange));
      border-radius: 2px;
    }
    .back ul { list-style: none; display: grid; gap: 4.5px; }
    .back li { display: flex; align-items: center; gap: 6px; font-size: 7.4px; font-weight: 500; color: var(--ink); line-height: 1.3; }
    .back li .ic {
      flex-shrink: 0;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #2468a8;
      display: grid;
      place-items: center;
    }
    .back li .ic svg { width: 7.5px; height: 7.5px; fill: none; stroke: var(--orange); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .back .bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, #2468a8, var(--sky) 40%, var(--teal) 70%, var(--orange));
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
    <path id="sg-body-c" d="M38 63C38 44 42.5 36.8 50 36.8S62 44 62 63z"/>
    <path id="sg-body-l" d="M19 63C19 50 24 44 31.8 44S44.6 50 44.6 63z"/>
    <path id="sg-body-r" d="M55.4 63.5C55.4 50 60 44 67.4 44S79.6 50 79.6 58.5z"/>
    <path id="sg-band" d="M16.8 53.2C9.5 56.8 8.5 63 20 66.2C33 69.6 60 67.8 74 61.2C81 57.8 86 52 89.4 43.8L86.4 42.1C82 51 77 55.6 70 58.6C57 63.8 33 64.2 22 62.2C15 60.8 12.8 57.3 16.8 53.2z"/>
    <mask id="sg-gap-center" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <use href="#sg-body-l" fill="#000" stroke="#000" stroke-width="2.6"/>
      <use href="#sg-body-r" fill="#000" stroke="#000" stroke-width="2.6"/>
    </mask>
    <mask id="sg-gap-band" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <use href="#sg-band" fill="#000" stroke="#000" stroke-width="3"/>
    </mask>
    </defs>
    <symbol id="mark" viewBox="7 17 91 72">
    <g mask="url(#sg-gap-band)">
      <g mask="url(#sg-gap-center)" fill="#4fa3e0">
        <circle cx="49.6" cy="27.4" r="8.3"/>
        <use href="#sg-body-c"/>
      </g>
      <circle cx="32.3" cy="36.4" r="7.3" fill="#5ec2bb"/>
      <use href="#sg-body-l" fill="#5ec2bb"/>
      <circle cx="67.6" cy="36.4" r="7.3" fill="#f7ae6c"/>
      <use href="#sg-body-r" fill="#f7ae6c"/>
      <path fill-rule="evenodd" fill="#4fa3e0" d="M12.5 65C30 69.5 55 70 70 66.5C78 64 83 59 87 59.2C89.6 59.4 89 63 85.5 66.5C78 74.5 66 84.5 48 86C30 87 16 77.5 12.5 65zM51 76C58 70.8 65 69.2 72.5 69.8C65 71.4 58 73.2 51 76z"/>
    </g>
    <use href="#sg-band" fill="#f39a55"/>
    <path d="M91.4 35.2L92.4 46L83.3 42.4z" fill="#f39a55"/>
    </symbol>
  </svg>

  <!-- FRONT -->
  <section class="card front">
    <svg class="ghost" aria-hidden="true"><use href="#mark"/></svg>

    <div class="brand">
      <svg aria-hidden="true"><use href="#mark"/></svg>
      <div>
        <div class="name">Sri Guru</div>
        <div class="sub">HR CONSULTANTS</div>
      </div>
    </div>

    <p class="tagline">Specialists in workforce optimisation</p>
  </section>

  <!-- BACK -->
  <section class="card back">
    <svg class="arcs" aria-hidden="true"><use href="#mark"/></svg>

    <div class="head">
      <svg aria-hidden="true"><use href="#mark"/></svg>
      <div>
        <div class="n">Sri Guru</div>
        <div class="s">HR CONSULTANTS</div>
      </div>
    </div>

    <p class="person">R S RAYUDU</p>
    <div class="rule"></div>

    <ul>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/></svg></span>
        +91 81250 14466
      </li>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        hr@sriguruhrconsultants.com
      </li>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0114 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
        15-28-395, KPHB Colony, Hyderabad – 500072
      </li>
    </ul>

    <div class="bar"></div>
  </section>

</body>
</html>
