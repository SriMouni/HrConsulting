<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sri Guru HR Consultants – Visiting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Standard Indian visiting card: 3.5in x 2in. Print: one side per page. */
    @page { size: 3.5in 2in; margin: 0; }

    :root {
      --navy: #12245c;
      --navy-2: #1d3a8f;
      --ocean: #0b5d8f;
      --sky: #3d9be0;
      --crimson: #b3172e;
      --rose: #ef4b63;
      --gold: #f5b83d;
      --ink: #1f2a44;
      --muted: #5a6680;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      background: #dfe4ee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card {
      position: relative;
      width: 3.5in;
      height: 2in;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(18, 36, 92, 0.25);
    }

    @media print {
      body { background: none; padding: 0; gap: 0; display: block; }
      .card { border-radius: 0; box-shadow: none; page-break-after: always; break-after: page; }
    }

    /* ---------- Front ---------- */
    .front {
      background:
        radial-gradient(circle at 85% 20%, rgba(245, 184, 61, 0.22), transparent 45%),
        linear-gradient(140deg, var(--navy) 0%, var(--navy-2) 60%, var(--ocean) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .front .ghost {
      position: absolute;
      right: -0.55in;
      top: -0.2in;
      width: 2.4in;
      opacity: 0.12;
    }
    .front .brand { position: relative; display: flex; align-items: center; gap: 0.12in; }
    .front .brand svg { width: 0.78in; height: 0.78in; }
    .front .name {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .front .sub {
      margin-top: 6px;
      font-size: 7.6px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--gold);
    }
    .front .tagline {
      position: absolute;
      bottom: 0.17in;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 8.5px;
      color: #c9d6f2;
      letter-spacing: 0.02em;
    }
    .front .tagline::before, .front .tagline::after {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      background: var(--gold);
      vertical-align: middle;
      margin: 0 8px;
      opacity: 0.8;
    }

    /* ---------- Back ---------- */
    .back {
      background: #fff;
      color: var(--ink);
      padding: 0.2in 0.22in;
    }
    .back .arcs {
      position: absolute;
      right: -0.62in;
      top: 50%;
      transform: translateY(-50%) scaleX(-1);
      width: 1.75in;
    }
    .back .head { display: flex; align-items: center; gap: 7px; }
    .back .head svg { width: 26px; height: 26px; }
    .back .head .n { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 12.5px; color: var(--navy); line-height: 1; }
    .back .head .s { font-size: 5.2px; font-weight: 700; letter-spacing: 0.3em; color: var(--crimson); margin-top: 3px; }

    .back .person {
      margin-top: 0.13in;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--navy);
    }
    .back .rule {
      width: 34px;
      height: 2px;
      margin: 5px 0 9px;
      background: linear-gradient(90deg, var(--ocean), var(--crimson), var(--gold));
      border-radius: 2px;
    }
    .back ul { list-style: none; display: grid; gap: 4.5px; }
    .back li { display: flex; align-items: center; gap: 6px; font-size: 7.4px; font-weight: 500; color: var(--ink); line-height: 1.3; }
    .back li .ic {
      flex-shrink: 0;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--navy);
      display: grid;
      place-items: center;
    }
    .back li .ic svg { width: 7.5px; height: 7.5px; fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .back .bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--navy), var(--ocean) 55%, var(--gold));
    }
  </style>
</head>
<body>

  <!-- FRONT -->
  <section class="card front">
    <svg class="ghost" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M46 8C28 8 13 18 13 32s15 24 33 24C32 52 21 44 21 32s11-20 25-24z" fill="#fff"/>
      <path d="M9 38c2 14 16 23 34 22C27 57 15 50 11 40z" fill="#fff"/>
    </svg>

    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#f5b83d" stroke-width="3" stroke-linecap="round"><path d="M44 20.5l2.3-3.2M49.3 27.7l3.8-1.3M49.3 36.3l3.8 1.3M44 43.5l2.3 3.2"/></g>
        <circle cx="36" cy="32" r="9" fill="#f5b83d"/>
        <path d="M46 8C28 8 13 18 13 32s15 24 33 24C32 52 21 44 21 32s11-20 25-24z" fill="#3d9be0"/>
        <path d="M9 38c2 14 16 23 34 22C27 57 15 50 11 40z" fill="#ef4b63"/>
      </svg>
      <div>
        <div class="name">Sri Guru</div>
        <div class="sub">HR CONSULTANTS</div>
      </div>
    </div>

    <p class="tagline">Specialists in workforce optimisation</p>
  </section>

  <!-- BACK -->
  <section class="card back">
    <svg class="arcs" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M46 8C28 8 13 18 13 32s15 24 33 24C32 52 21 44 21 32s11-20 25-24z" fill="#0b5d8f"/>
      <path d="M9 38c2 14 16 23 34 22C27 57 15 50 11 40z" fill="#b3172e"/>
    </svg>

    <div class="head">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#e9a524" stroke-width="3" stroke-linecap="round"><path d="M44 20.5l2.3-3.2M49.3 27.7l3.8-1.3M49.3 36.3l3.8 1.3M44 43.5l2.3 3.2"/></g>
        <circle cx="36" cy="32" r="9" fill="#f5b83d"/>
        <path d="M46 8C28 8 13 18 13 32s15 24 33 24C32 52 21 44 21 32s11-20 25-24z" fill="#0b5d8f"/>
        <path d="M9 38c2 14 16 23 34 22C27 57 15 50 11 40z" fill="#b3172e"/>
      </svg>
      <div>
        <div class="n">Sri Guru</div>
        <div class="s">HR CONSULTANTS</div>
      </div>
    </div>

    <p class="person">R S RAYUDU</p>
    <div class="rule"></div>

    <ul>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/></svg></span>
        +91 81250 14466
      </li>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        hr@sriguruhrconsultants.com
      </li>
      <li>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0114 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
        15-28-395, KPHB Colony, Hyderabad – 500072
      </li>
    </ul>

    <div class="bar"></div>
  </section>

</body>
</html>
