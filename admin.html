<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Sri Guru HR Consultants</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">

  <!-- Shown until js/config.js has the Supabase details -->
  <main class="auth-screen" id="screen-setup" hidden>
    <div class="auth-card">
      <img src="assets/logo-mark.svg" alt="" class="auth-logo" />
      <h1>Admin not connected yet</h1>
      <p class="muted">Add the Supabase Project URL and anon key to <code>js/config.js</code>, then reload this page.</p>
    </div>
  </main>

  <!-- Sign in -->
  <main class="auth-screen" id="screen-login" hidden>
    <form class="auth-card" id="login-form" novalidate>
      <img src="assets/logo-mark.svg" alt="" class="auth-logo" />
      <h1>Sri Guru HR Admin</h1>
      <p class="muted">Sign in to view candidates, vacancies and enquiries.</p>
      <label>Email<input type="email" name="email" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn">Sign in</button>
      <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>
      <p class="auth-note" id="login-note" role="status"></p>
    </form>
  </main>

  <!-- Set a new password (after following a reset link) -->
  <main class="auth-screen" id="screen-reset" hidden>
    <form class="auth-card" id="reset-form" novalidate>
      <img src="assets/logo-mark.svg" alt="" class="auth-logo" />
      <h1>Set a new password</h1>
      <label>New password (at least 8 characters)<input type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
      <button type="submit" class="btn">Save password</button>
      <p class="auth-note" id="reset-note" role="status"></p>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="screen-app" hidden>
    <header class="admin-header">
      <div class="admin-brand">
        <img src="assets/logo-mark.svg" alt="" />
        <span><strong>Sri Guru HR</strong><small>Admin</small></span>
      </div>
      <div class="admin-user">
        <span id="user-email" class="muted"></span>
        <button class="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
      </div>
    </header>

    <main class="admin-main">
      <nav class="admin-tabs" role="tablist" aria-label="Records">
        <button type="button" role="tab" data-view="candidates" aria-selected="true">Candidates <span class="count" data-count="candidates">0</span></button>
        <button type="button" role="tab" data-view="vacancies" aria-selected="false">Vacancies <span class="count" data-count="vacancies">0</span></button>
        <button type="button" role="tab" data-view="enquiries" aria-selected="false">Enquiries <span class="count" data-count="enquiries">0</span></button>
      </nav>

      <div class="admin-toolbar">
        <input type="search" id="search" placeholder="Search name, role, company, phone…" aria-label="Search" />
        <select id="status-filter" aria-label="Filter by status"></select>
        <button type="button" class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
        <button type="button" class="btn btn-sm" id="export-btn">Export CSV</button>
      </div>

      <p class="admin-summary muted" id="summary" role="status"></p>
      <div class="table-wrap">
        <table class="admin-table" id="records"></table>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
